<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — SkillForge</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="container narrow">
    <div class="auth-card">
      <h1>Log in to SkillForge</h1>
      <p class="muted small">Continue your career roadmap.</p>

      <form id="loginForm" class="stack">
        <label class="field">
          <span>Email</span>
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="formError" class="status error" role="alert"></p>
        <button class="btn btn-primary btn-lg" type="submit">Log In</button>
      </form>

      <p class="auth-alt">New here? <a href="register.html">Create an account</a></p>
    </div>
  </main>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
