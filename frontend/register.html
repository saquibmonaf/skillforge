<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — SkillForge</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="container narrow">
    <div class="auth-card">
      <h1>Create your SkillForge account</h1>
      <p class="muted small">Start building your career roadmap.</p>

      <form id="registerForm" class="stack">
        <label class="field">
          <span>Full Name</span>
          <input name="name" type="text" autocomplete="name" required>
        </label>
        <label class="field">
          <span>Email</span>
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <p id="formError" class="status error" role="alert"></p>
        <button class="btn btn-primary btn-lg" type="submit">Create Account</button>
      </form>

      <p class="auth-alt">Already registered? <a href="login.html">Log in</a></p>
    </div>
  </main>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
